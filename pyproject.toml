[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "ai-dial-openapi-to-mcp"
version = "0.2.0rc1"
description = "A secure OpenAPI-to-MCP bridge for DIAL and MCP clients"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
authors = [
    {name = "EPAM Systems"}
]
keywords = ["mcp", "openapi", "fastmcp", "middleware", "proxy", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastmcp (>=3.4.0,<3.5.0)",
    "httpx>=0.28.1,<1.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "starlette (>=1.3.1,<2.0.0)",
]

[project.optional-dependencies]
performance = [
    "uvloop>=0.22.1",
]

[project.urls]
Homepage = "https://dialx.ai"
Documentation = "https://github.com/epam/ai-dial-openapi-to-mcp#readme"
Repository = "https://github.com/epam/ai-dial-openapi-to-mcp.git"
Issues = "https://github.com/epam/ai-dial-openapi-to-mcp/issues"

[project.scripts]
openapi-to-mcp = "dial_openapi_to_mcp.__main__:main"

[tool.poetry]
requires-poetry = '>=2.0.0,<3.0.0'
packages = [{include = "dial_openapi_to_mcp", from = "src"}]
# poetry-core's sdist builder ignores MANIFEST.in; these must be declared here.
include = [
    "CONFIGURATION.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "CODE_OF_CONDUCT.md",
    "docs/*.md",
    "examples/*.py",
    "examples/*.md",
]

[tool.poetry.group.dev.dependencies]
build = ">=1.2.2"
autoflake = ">=2.3.1"
black = ">=26.3.1"
flake8 = ">=7.3.0"
isort = ">=5.13.2"
mypy = ">=1.20.0"
pre-commit = ">=3.8.0"
pyright = ">=1.1.394"
pytest = ">=9.0.3"
pytest-asyncio = ">=1.3.0"
pytest-cov = ">=7.0.0"
pytest-httpx = ">=0.35.0,<0.37.0"
types-PyYAML = ">=6.0.12"

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.black]
line-length = 100
skip-string-normalization = true
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.autoflake]
ignore_init_module_imports = true
remove_all_unused_imports = true
in_place = true
recursive = true
quiet = true

[tool.pyright]
typeCheckingMode = "basic"
reportIncompatibleMethodOverride = "error"
reportUnusedVariable = "error"
exclude = [".git", ".venv", "**/__pycache__", "**/.pytest_cache"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["httpx.*", "fastmcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: tests that start real server processes and make HTTP calls",
]
addopts = "--strict-markers"
