services:
  openapi-to-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/epam/ai-dial-openapi-to-mcp:development
    environment:
      MCP_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MCP_CACHE_MAX_SIZE: ${MCP_CACHE_MAX_SIZE:-100}
      MCP_CACHE_TTL: ${MCP_CACHE_TTL:-3600}
      MCP_CACHE_CLEANUP_INTERVAL: ${MCP_CACHE_CLEANUP_INTERVAL:-300}
      MCP_VALIDATE_OUTPUT: ${MCP_VALIDATE_OUTPUT:-true}
      PATH_PARAMS_ALLOW_RESERVED: ${PATH_PARAMS_ALLOW_RESERVED:-false}
      MCP_DEREFERENCE_SCHEMAS: ${MCP_DEREFERENCE_SCHEMAS:-true}
      OPENAPI_FETCH_TIMEOUT: ${OPENAPI_FETCH_TIMEOUT:-10}
      OPENAPI_FETCH_MAX_BYTES: ${OPENAPI_FETCH_MAX_BYTES:-10485760}
      OPENAPI_FETCH_SEND_AUTH: ${OPENAPI_FETCH_SEND_AUTH:-false}
      OPENAPI_URL_CACHE_TTL: ${OPENAPI_URL_CACHE_TTL:-3600}
      OPENAPI_URL_CACHE_STALE_TTL: ${OPENAPI_URL_CACHE_STALE_TTL:-86400}
      OPENAPI_URL_CACHE_MAX_ENTRIES: ${OPENAPI_URL_CACHE_MAX_ENTRIES:-32}
      DIAL_URL: ${DIAL_URL:-}
      DIAL_CORE_URL: ${DIAL_CORE_URL:-}
      OUTBOUND_HEADER_ALLOWLIST: ${OUTBOUND_HEADER_ALLOWLIST:-}
      OUTBOUND_HEADER_BLOCKLIST: ${OUTBOUND_HEADER_BLOCKLIST-authorization,cookie,set-cookie,proxy-authorization,host,connection,keep-alive,proxy-authenticate,te,trailer,transfer-encoding,upgrade,forwarded,x-forwarded-for,x-forwarded-host,x-forwarded-proto}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
    ports:
      - "${HOST_PORT:-8080}:8080"
      - "${METRICS_HOST_PORT:-9464}:9464"
    restart: unless-stopped

  sample-api:
    image: swaggerapi/petstore3:1.0.7
    profiles: ["sample"]
    ports:
      - "8000:8080"
