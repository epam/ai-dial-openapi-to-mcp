version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "09:00"
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "09:00"
    commit-message:
      prefix: chore
    groups:
      ai-dial-ci:
        applies-to: version-updates
        patterns: ["epam/ai-dial-ci/*"]
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["epam/ai-dial-ci/*"]
