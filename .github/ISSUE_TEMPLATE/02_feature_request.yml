    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    attributes:
      label: Use case or motivation
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Confidential information
      options:
        - label: This issue contains no credentials, personal data, or private infrastructure details.
          required: true
